$kind: http-request
name: 1.6 Diferencia de cálculo pequeña → aceptado con observaciones
description: |-
  **Tipo:** caso de prueba

  **Objetivo:** Mostrar que una diferencia de cálculo menor no rechaza el documento: se acepta con observaciones (como en el ejemplo oficial).

  **Datos de entrada:** DTE válido con `resumen.totalIva` = 26.06 en lugar de 26.00.

  **Resultado esperado:** HTTP 200, `estado: PROCESADO`, `codigoMsg: 002` (RECIBIDO CON OBSERVACIONES) y una observación sobre `resumen.totalIva`.

  **Criterio de éxito:** Código 200, código 002 y la observación presente en `observaciones`.
url: "{{base_url}}/api/hacienda-sim/fesv/recepciondte"
method: POST
headers:
  Content-Type: application/json
  Authorization: "{{token}}"
body:
  type: json
  content: "{}"
scripts:
  - type: beforeRequest
    code: |-
      const H = eval(pm.collectionVariables.get("helpers"));
      const dte = H.dteValido(pm);
      dte.resumen.totalIva = 26.06; // diferencia de 0.06
      const cuerpo = H.peticion(pm, dte, undefined);
      pm.request.body.update(JSON.stringify(cuerpo));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      const j = pm.response.json();
      pm.test("estado = PROCESADO", function () { pm.expect(j.estado).to.eql("PROCESADO"); });
      pm.test("codigoMsg = 002", function () { pm.expect(j.codigoMsg).to.eql("002"); });
      pm.test("clasificaMsg = 10", function () { pm.expect(j.clasificaMsg).to.eql("10"); });
      pm.test("observaciones menciona resumen.totalIva", function () { pm.expect(j.observaciones.join(' ')).to.include('resumen.totalIva'); });
    language: text/javascript
order: 6000
