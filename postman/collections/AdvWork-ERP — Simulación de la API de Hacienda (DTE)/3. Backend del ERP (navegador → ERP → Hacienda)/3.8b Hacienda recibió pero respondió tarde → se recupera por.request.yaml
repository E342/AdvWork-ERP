$kind: http-request
name: 3.8b Hacienda recibió pero respondió tarde → se recupera por consulta (≈5 s)
description: |-
  **Tipo:** caso de prueba

  **Objetivo:** Demostrar la política oficial: si no hay respuesta en 5 s, primero se CONSULTA el estado antes de reenviar, evitando un documento duplicado.

  **Datos de entrada:** Factura válida con la simulación en modo `timeout_procesado` (procesa y guarda el documento, pero responde después del umbral).

  **Resultado esperado:** HTTP 200, `resultado: aceptado`, `recuperadoPorConsulta: true`, 1 envío y 1 consulta, tras ≈5 s de espera.

  **Criterio de éxito:** Código 200, `recuperadoPorConsulta` verdadero, exactamente 1 envío (no se reenvió) y 1 consulta; tiempo de respuesta de al menos 4.8 s.
url: "{{base_url}}/api/erp/dte/transmitir"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{}"
scripts:
  - type: beforeRequest
    code: |-
      const H = eval(pm.collectionVariables.get("helpers"));
      const cuerpo = H.facturaErp(pm, {});
      pm.request.body.update(JSON.stringify(cuerpo));
      pm.collectionVariables.set("erp_tardia", JSON.stringify(cuerpo));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      const j = pm.response.json();
      pm.test("ok = true", function () { pm.expect(j.ok).to.eql(true); });
      pm.test("resultado = aceptado", function () { pm.expect(j.resultado).to.eql("aceptado"); });
      pm.test("facturaEstado = Emitida", function () { pm.expect(j.facturaEstado).to.eql("Emitida"); });
      pm.test("envios = 1", function () { pm.expect(j.envios).to.eql(1); });
      pm.test("consultas = 1", function () { pm.expect(j.consultas).to.eql(1); });
      pm.test("recuperadoPorConsulta = true", function () { pm.expect(j.recuperadoPorConsulta).to.eql(true); });
      pm.test("esperó el umbral de 5 s antes de consultar", function () { pm.expect(pm.response.responseTime).to.be.above(4800); });
    language: text/javascript
order: 12000
