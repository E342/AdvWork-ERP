$kind: http-request
name: "3.9a Escenario: timeout"
description: |-
  **Tipo:** preparación

  Pone la simulación en modo `timeout`. Hacienda no responderá ni procesará el documento.
url: "{{base_url}}/api/hacienda-sim/control/escenario"
method: PUT
headers:
  Content-Type: application/json
  Authorization: "{{token}}"
body:
  type: json
  content: '{"modo":"timeout"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      pm.test("modo = timeout", function () { pm.expect(pm.response.json().modo).to.eql("timeout"); });
    language: text/javascript
order: 15000
