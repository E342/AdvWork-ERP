$kind: http-request
description: |-
  **Tipo:** caso de prueba

  **Objetivo:** Demostrar que se conserva el DTE enviado y cada intento (fecha, estado HTTP, respuesta).

  **Datos de entrada:** GET de la transmisión del caso 3.1.

  **Resultado esperado:** HTTP 200, `estadoProceso: finalizada`, el DTE con el mismo `codigoGeneracion` y 1 intento.

  **Criterio de éxito:** Código 200, estado finalizada, `codigoGeneracion` del DTE igual al de 3.1 y 1 intento con HTTP 200.
url: "{{base_url}}/api/erp/dte/transmisiones/{{trx_id_valida}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      const j = pm.response.json();
      pm.test("estadoProceso = finalizada", function () { pm.expect(j.estadoProceso).to.eql("finalizada"); });
      pm.test("el DTE guardado tiene el codigoGeneracion de 3.1", function () { pm.expect(j.dte.identificacion.codigoGeneracion).to.eql(pm.collectionVariables.get("cg_erp_valida")); });
      pm.test("un intento, con HTTP 200", function () { pm.expect(j.intentos).to.have.lengthOf(1); pm.expect(j.intentos[0].httpStatus).to.eql(200); });
    language: text/javascript
order: 22000
