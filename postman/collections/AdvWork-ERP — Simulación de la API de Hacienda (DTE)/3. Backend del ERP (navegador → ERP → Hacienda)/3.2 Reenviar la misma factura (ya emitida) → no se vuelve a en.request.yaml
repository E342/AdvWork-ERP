$kind: http-request
name: 3.2 Reenviar la misma factura (ya emitida) → no se vuelve a enviar
description: |-
  **Tipo:** caso de prueba

  **Objetivo:** Documentar el comportamiento controlado del REENVÍO desde el ERP: una factura ya emitida no se envía otra vez.

  **Datos de entrada:** El mismo cuerpo exacto del caso 3.1.

  **Resultado esperado:** HTTP 200, `yaEmitida: true`, 0 envíos y 0 consultas, la MISMA transmisión y el MISMO sello del caso 3.1.

  **Criterio de éxito:** Código 200, `yaEmitida` verdadero, `envios` 0, y `transmisionId` y `selloRecibido` idénticos a los de 3.1.
url: "{{base_url}}/api/erp/dte/transmitir"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{}"
scripts:
  - type: beforeRequest
    code: pm.request.body.update(pm.collectionVariables.get("erp_valida"));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      const j = pm.response.json();
      pm.test("ok = true", function () { pm.expect(j.ok).to.eql(true); });
      pm.test("envios = 0", function () { pm.expect(j.envios).to.eql(0); });
      pm.test("consultas = 0", function () { pm.expect(j.consultas).to.eql(0); });
      pm.test("yaEmitida = true", function () { pm.expect(j.yaEmitida).to.eql(true); });
      pm.test("misma transmisión que en 3.1", function () { pm.expect(j.transmisionId).to.eql(pm.collectionVariables.get("trx_id_valida")); });
      pm.test("mismo sello que en 3.1", function () { pm.expect(j.selloRecibido).to.eql(pm.collectionVariables.get("sello_erp_valida")); });
    language: text/javascript
order: 2000
