$kind: http-request
description: |-
  **Tipo:** caso de prueba

  **Objetivo:** Comprobar que el ERP rechaza peticiones que un navegador envía desde otro sitio web.

  **Datos de entrada:** Factura válida con el encabezado `Origin: http://evil.example`.

  **Resultado esperado:** HTTP 403, `error: origen_no_permitido`; la factura NO se procesa.

  **Criterio de éxito:** Código 403 y `error` igual a `origen_no_permitido`.
url: "{{base_url}}/api/erp/dte/transmitir"
method: POST
headers:
  Content-Type: application/json
  Origin: http://evil.example
body:
  type: json
  content: "{}"
scripts:
  - type: beforeRequest
    code: |-
      const H = eval(pm.collectionVariables.get("helpers"));
      const cuerpo = H.facturaErp(pm, {});
      pm.request.body.update(JSON.stringify(cuerpo));
      pm.collectionVariables.set("erp_csrf", JSON.stringify(cuerpo));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("HTTP 403", function () { pm.response.to.have.status(403); });
      const j = pm.response.json();
      pm.test("ok = false", function () { pm.expect(j.ok).to.eql(false); });
      pm.test("error = origen_no_permitido", function () { pm.expect(j.error).to.eql("origen_no_permitido"); });
    language: text/javascript
order: 24000
