$kind: http-request
description: |-
  **Tipo:** caso de prueba

  **Objetivo:** Demostrar el ciclo completo desde el ERP: construir el DTE, firmarlo, enviarlo y registrar la respuesta.

  **Datos de entrada:** POST `{ factura, cliente }` con 2 ítems (Bicicleta ×1 a $100; Guantes ×2 a $50 con 10 % de descuento), cliente con documento válido.

  **Resultado esperado:** HTTP 200, `ok: true`, `resultado: aceptado`, `facturaEstado: Emitida`, 1 envío y 0 consultas; sello de 40 caracteres; total del DTE $214.70.

  **Criterio de éxito:** Código 200; resultado y estado como se indica; sello, `codigoGeneracion` y `numeroControl` con formato válido; `totales.totalPagar` = 214.7.
url: "{{base_url}}/api/erp/dte/transmitir"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{}"
scripts:
  - type: beforeRequest
    code: |-
      const H = eval(pm.collectionVariables.get("helpers"));
      const cuerpo = H.facturaErp(pm, {});
      pm.request.body.update(JSON.stringify(cuerpo));
      pm.collectionVariables.set("erp_valida", JSON.stringify(cuerpo));
      pm.collectionVariables.set("fac_id_valida", cuerpo.factura.id);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      const j = pm.response.json();
      pm.test("ok = true", function () { pm.expect(j.ok).to.eql(true); });
      pm.test("resultado = aceptado", function () { pm.expect(j.resultado).to.eql("aceptado"); });
      pm.test("facturaEstado = Emitida", function () { pm.expect(j.facturaEstado).to.eql("Emitida"); });
      pm.test("envios = 1", function () { pm.expect(j.envios).to.eql(1); });
      pm.test("consultas = 0", function () { pm.expect(j.consultas).to.eql(0); });
      pm.test("yaEmitida = false", function () { pm.expect(j.yaEmitida).to.eql(false); });
      pm.test("selloRecibido: 40 caracteres alfanuméricos", function () { pm.expect(j.selloRecibido).to.match(/^[A-Z0-9]{40}$/); });
      pm.test("codigoGeneracion: UUID v4 en mayúsculas", function () { pm.expect(j.codigoGeneracion).to.match(/^[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}$/); });
      pm.test("numeroControl con formato DTE-01-M001P001-<15 dígitos>", function () { pm.expect(j.numeroControl).to.match(/^DTE-01-M001P001-\d{15}$/); });
      pm.test("total del DTE = 214.70", function () { pm.expect(j.totales.totalPagar).to.eql(214.7); });
      pm.collectionVariables.set("trx_id_valida", j.transmisionId);
      pm.collectionVariables.set("sello_erp_valida", j.selloRecibido);
      pm.collectionVariables.set("cg_erp_valida", j.codigoGeneracion);
    language: text/javascript
order: 1000
